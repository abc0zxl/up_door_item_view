        body { font-family: 'Inter', sans-serif; background-color: #F7F6F5; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        input:focus, textarea:focus { outline: none; }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<nav class="fixed top-0 w-full z-50 bg-[#F7F6F5]/80 backdrop-blur-xl">
<div class="flex justify-between items-center px-6 h-16 w-full max-w-screen-xl mx-auto relative">
<button class="flex items-center justify-center w-10 h-10 hover:bg-neutral-100 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">arrow_back_ios_new</span>
</button>
<h1 class="font-headline font-bold text-xl tracking-tight text-primary">编辑地址</h1>
<button class="text-on-surface-variant font-medium text-sm hover:text-primary transition-colors">删除</button>
<!-- Separation Logic -->
<div class="bg-surface-container h-[1px] w-full absolute bottom-0 left-0"></div>
</div>
</nav>
<!-- Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-6 max-w-2xl mx-auto w-full">
<div class="space-y-8">
<!-- Header Section (Editorial) -->
<header class="space-y-2">
<h2 class="font-headline font-extrabold text-3xl text-on-background leading-tight">完善您的<br/><span class="text-primary">服务地址</span></h2>
<p class="text-on-surface-variant text-sm">请提供准确的地址，以便我们的服务人员准时到达。</p>
</header>
<!-- Form Container -->
<form class="space-y-6">
<!-- Contact Info Group -->
<div class="bg-surface-container-lowest p-8 rounded-xl space-y-6">
<div class="space-y-2">
<label class="font-headline font-bold text-sm text-on-surface ml-1">联系人</label>
<div class="group flex items-center bg-surface-container-low rounded-xl px-5 py-4 transition-all focus-within:bg-surface-container-lowest focus-within:soft-glow">
<span class="material-symbols-outlined text-primary-fixed-dim mr-3">person</span>
<input class="bg-transparent w-full border-none p-0 text-on-surface placeholder:text-outline-variant font-medium" placeholder="收货人姓名" type="text" value="王小明"/>
</div>
</div>
<div class="space-y-2">
<label class="font-headline font-bold text-sm text-on-surface ml-1">手机号码</label>
<div class="group flex items-center bg-surface-container-low rounded-xl px-5 py-4 transition-all focus-within:bg-surface-container-lowest focus-within:soft-glow">
<span class="material-symbols-outlined text-primary-fixed-dim mr-3">phone_iphone</span>
<input class="bg-transparent w-full border-none p-0 text-on-surface placeholder:text-outline-variant font-medium" placeholder="请输入手机号" type="tel" value="138 0013 8000"/>
</div>
</div>
</div>
<!-- Location Group -->
<div class="bg-surface-container-lowest p-8 rounded-xl space-y-6">
<div class="space-y-2">
<label class="font-headline font-bold text-sm text-on-surface ml-1">所在地区</label>
<div class="group flex items-center justify-between bg-surface-container-low rounded-xl px-5 py-4 transition-all active:scale-[0.98] cursor-pointer">
<div class="flex items-center">
<span class="material-symbols-outlined text-primary-fixed-dim mr-3">location_on</span>
<span class="text-on-surface font-medium">北京市 朝阳区 建外街道</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</div>
</div>
<div class="space-y-2">
<label class="font-headline font-bold text-sm text-on-surface ml-1">详细地址</label>
<div class="group flex items-start bg-surface-container-low rounded-xl px-5 py-4 transition-all focus-within:bg-surface-container-lowest focus-within:soft-glow">
<span class="material-symbols-outlined text-primary-fixed-dim mr-3 mt-0.5">home</span>
<textarea class="bg-transparent w-full border-none p-0 text-on-surface placeholder:text-outline-variant font-medium resize-none" placeholder="街道、楼牌号等详细信息" rows="3">建外SOHO 3号楼 1502室</textarea>
</div>
</div>
</div>
<!-- Settings Group -->
<div class="bg-surface-container-lowest px-8 py-6 rounded-xl flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary">verified_user</span>
</div>
<div>
<p class="font-headline font-bold text-sm text-on-surface">设为默认地址</p>
<p class="text-xs text-on-surface-variant">下单时将优先使用该地址</p>
</div>
</div>
<!-- Switch Component -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary-fixed"></div>
</label>
</div>
</form>
<!-- Map Hint (Editorial Visual) -->
<div class="relative w-full h-40 rounded-xl overflow-hidden grayscale-[0.2] opacity-80">
<img class="w-full h-full object-cover" data-alt="clean minimal stylized map of a city residential area with soft warm lighting and orange marker dots" data-location="Beijing" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAvTPx8UbFJEsPoijNxrmPWzmeY1vChWuuqVIm_ZJJd0n_zlQlyAiaBC2X1jmGIZ2RnrocGHGp9QDuWQhUc2SzRgM1fUfcpBkLaAsdkUGds3yFkKj98pNcO-4neRQ91tcMDV2mVlYNiEtmn1x58v7u_-cb8ZT55htxFXW-OLfqLyWT2_q9LjThELxVI5LBDWcPSlmM7W2_OId4QNHqb75htblxznI0jFH-xTFlBKl66VFeZdcQR0IdGmgz_w--zUZCPFjpoGpv1TA"/>
<div class="absolute inset-0 bg-gradient-to-t from-background/80 to-transparent"></div>
<div class="absolute bottom-4 left-4 flex items-center space-x-2 bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-full border border-primary/10">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">my_location</span>
<span class="text-[10px] font-bold text-on-surface uppercase tracking-wider">智能定位校准中</span>
</div>
</div>
</div>
</main>
<!-- Sticky Action Bar -->
<div class="fixed bottom-0 left-0 w-full p-6 pb-10 bg-background/60 backdrop-blur-xl z-40">
<div class="max-w-2xl mx-auto">
<button class="w-full bg-primary-gradient py-5 rounded-xl text-on-primary font-headline font-extrabold text-lg shadow-[0_12px_32px_0_rgba(255,133,27,0.2)] active:scale-95 transition-all flex items-center justify-center space-x-2">
<span>保存并使用地址</span>
</button>
</div>
</div>
</body></html>
